name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: moeum

# OIDC 로 AWS 에 붙는다. 액세스 키를 GitHub 시크릿에 넣지 않는다.
permissions:
  id-token: write
  contents: read

# 배포 중에 다음 푸시가 겹치면 앞의 것을 취소한다. 인스턴스가 한 대라 동시 배포는 무의미하다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Testcontainers 가 러너의 도커로 MySQL 을 띄운다. 별도 서비스 컨테이너가 필요 없다.
      - name: 테스트
        working-directory: moeum
        run: ./gradlew --no-daemon test

      - name: 테스트 리포트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: moeum/build/reports/tests/test
          retention-days: 7

  deploy:
    name: 빌드 및 배포
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: moeum
          push: true
          # 커밋 SHA 로 태그를 박는다. 지금 도는 게 어느 커밋인지 항상 역추적된다.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSM 으로 배포
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # 설정 파일의 원본은 이 저장소다. 배포할 때마다 인스턴스로 동기화한다.
          # base64 로 감싸서 보내면 따옴표·줄바꿈이 SSM 페이로드를 깨지 않는다.
          COMPOSE_B64=$(base64 -w0 deploy/docker-compose.prod.yml)
          CADDY_B64=$(base64 -w0 deploy/Caddyfile)
          DEPLOY_B64=$(base64 -w0 deploy/deploy.sh)

          jq -n \
            --arg compose "$COMPOSE_B64" \
            --arg caddy "$CADDY_B64" \
            --arg deploy "$DEPLOY_B64" \
            --arg image "$IMAGE_URI" \
            --arg region "$AWS_REGION" '{
              commands: [
                "set -euo pipefail",
                "mkdir -p /opt/moeum && cd /opt/moeum",
                "echo \($compose) | base64 -d > docker-compose.prod.yml",
                "echo \($caddy) | base64 -d > Caddyfile",
                "echo \($deploy) | base64 -d > deploy.sh",
                "chmod +x deploy.sh",
                "AWS_REGION=\($region) ./deploy.sh \($image)"
              ],
              executionTimeout: ["900"]
            }' > /tmp/params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file:///tmp/params.json \
            --query Command.CommandId --output text)

          echo "SSM 명령: $CMD_ID"

          # wait 는 실패 상태에서 0 이 아닌 코드로 끝난다. 그걸로 잡 성패를 가른다.
          set +e
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          WAIT_RC=$?
          set -e

          echo "── 인스턴스 출력 ──"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ $WAIT_RC -ne 0 ]; then
            echo "── 에러 출력 ──" >&2
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text >&2
            exit 1
          fi
