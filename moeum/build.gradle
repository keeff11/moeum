plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'store.moeum'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aop'   // @Retryable AOP
	implementation 'org.springframework.retry:spring-retry'
	implementation platform('software.amazon.awssdk:bom:2.32.14')
	implementation 'software.amazon.awssdk:s3'   // presigned 업로드 URL 발급
	implementation 'org.springframework.session:spring-session-jdbc'   // 세션을 MySQL 로 (D-020)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'com.mysql:mysql-connector-j'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.wiremock:wiremock-standalone:3.13.1'   // point3 실패 케이스 재현
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()

	// 운영 컨테이너가 TZ=Asia/Seoul · -Duser.timezone=Asia/Seoul 로 고정돼 있다.
	// 테스트도 같은 조건이어야 한다 — GitHub Actions 러너는 UTC 라 그대로 두면
	// hibernate.jdbc.time_zone(Asia/Seoul)이 JVM 기본 타임존 기준으로 변환하면서
	// Hibernate 가 쓴 값과 JDBC 로 읽은 값이 9시간 어긋난다.
	// 개발자마다 로컬 타임존이 달라도 같은 결과가 나오게 하는 목적도 있다.
	systemProperty 'user.timezone', 'Asia/Seoul'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
	systemProperty 'file.encoding', 'UTF-8'
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat = 'short'
	}
}
