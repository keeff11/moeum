services:
  mysql:
    image: mysql:8.0
    container_name: moeum-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moeum
      MYSQL_USER: moeum
      MYSQL_PASSWORD: moeum
      # EOB 차단 시간대(23:30~00:30 KST) 판단이 DB 시각에 걸려 있다. 컨테이너도 KST 로 맞춘다.
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      - --innodb-lock-wait-timeout=5
      - --max-connections=300
    volumes:
      - moeum-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  moeum-mysql-data:
