spring:
  application:
    name: moeum
  profiles:
    default: local

  jpa:
    # 스키마는 Flyway 가 만든다. Hibernate 는 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true
        # 컬렉션을 IN 절로 한 번에 끌어온다 (판매 폼 상세의 옵션 N+1 방지)
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # 세션을 톰캣 힙이 아니라 MySQL 에 둔다 (D-020).
  # 배포로 컨테이너가 교체돼도 로그인이 유지된다. 애플리케이션 코드는 바뀌지 않는다 —
  # Spring Session 이 HttpSession 구현만 바꿔치기한다.
  session:
    store-type: jdbc
    jdbc:
      # 스키마는 Flyway(V2__spring_session.sql)가 소유한다. 라이브러리가 만들게 두지 않는다.
      initialize-schema: never
      # 톰캣이 하던 만료 세션 정리를 이제 이 스케줄러가 한다
      cleanup-cron: "0 * * * * *"

  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        name: MOEUM_SESSION
        http-only: true
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/moeum?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul&rewriteBatchedStatements=true
    username: moeum
    password: moeum
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    show-sql: true

moeum:
  auth:
    # 로컬은 http 라 Secure 를 붙이면 쿠키가 저장되지 않는다
    cookie-secure: false
    # 비워 두면 Origin 검증을 하지 않는다. 프론트 개발 서버를 붙일 때 채운다
    allowed-origins: ${ALLOWED_ORIGINS:}
  crypto:
    # 로컬 전용 개발 키. 환경변수가 있으면 그쪽을 쓴다
    seller-key: ${SELLER_CRYPTO_KEY:bW9ldW0tbG9jYWwtZGV2LWtleS1ETy1OT1QtVVNFISE=}
  storage:
    # 비워 두면 이미지 업로드만 꺼진다. 로컬에서 AWS 자격증명을 갖추게 만들 이유가 없다
    bucket: ${S3_BUCKET:}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:local-client-id}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/auth/kakao/callback}
      connect-timeout: 3s
      read-timeout: 5s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # 시크릿은 환경변수로만 주입한다 (8단계에서 시크릿 매니저로 이관)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000

  jpa:
    show-sql: false

moeum:
  auth:
    cookie-secure: true
    # CSRF 2차 방어 (api-spec 10-11). 운영에서는 반드시 채운다
    allowed-origins: ${ALLOWED_ORIGINS}
  crypto:
    # 32바이트 AES-256 키의 Base64. 환경변수로만 주입한다
    seller-key: ${SELLER_CRYPTO_KEY}
  storage:
    # 기본값을 비워 둔다. 파라미터가 없어도 앱은 뜨고 이미지 업로드만 꺼진다.
    # KAKAO_CLIENT_SECRET 과 같은 이유다 — 값 하나가 없다고 서비스 전체가 멈추면 안 된다.
    bucket: ${S3_BUCKET:}
    # 나중에 CloudFront 를 앞에 세우면 이 값만 바꾼다. 쌓인 행은 키만 갖고 있어 손대지 않는다
    public-base-url: ${S3_PUBLIC_BASE_URL:}
  oauth:
    kakao:
      # 카카오 앱 등록 정보는 전부 서버가 갖는다 (api-spec 10-8)
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
      connect-timeout: 3s
      read-timeout: 5s

server:
  servlet:
    session:
      cookie:
        secure: true

springdoc:
  # 운영에서는 통째로 끈다. 켜 두면 관리자 API 까지 그대로 노출된다
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
    store.moeum: info
