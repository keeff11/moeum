# 테스트 프로파일. datasource 는 Testcontainers 가 @DynamicPropertySource 로 주입한다.
spring:
  jpa:
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

moeum:
  # 릴레이는 1초마다 도는데, 그대로 두면 테스트가 PENDING 을 확인하기 전에 SENT 로 넘어간다.
  # 테스트는 relayOnce() 를 직접 부른다
  batch:
    outbox-delay: 3600000
  auth:
    cookie-secure: false
  crypto:
    seller-key: bW9ldW0tbG9jYWwtZGV2LWtleS1ETy1OT1QtVVNFISE=
  storage:
    bucket: moeum-test-bucket
    public-base-url: https://img.test.moeum.store
  oauth:
    kakao:
      client-id: test-client-id
      client-secret: test-secret
      redirect-uri: http://localhost/auth/kakao/callback

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.testcontainers: warn
    com.github.dockerjava: warn
