# 테스트 프로파일. datasource 는 Testcontainers 가 @DynamicPropertySource 로 주입한다.
spring:
  jpa:
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

moeum:
  # 배치는 테스트에서 스스로 돌지 않게 막는다. 테스트는 relayOnce() · closeOnce() 처럼
  # 직접 부르므로 검증력은 그대로다.
  #
  # 릴레이(1초)는 테스트가 PENDING 을 확인하기 전에 SENT 로 넘겨 버려서 막았고,
  # 나머지(60초)는 sale_form · orders 를 훑는 UPDATE 라 테스트의 같은 행과 물려
  # 데드락을 낸다 — 10분짜리 suite 에서 열 번쯤 끼어들어 엉뚱한 클래스가 실패한다
  batch:
    outbox-delay: 3600000
    sale-form-close-delay: 3600000
    shortfall-delay: 3600000
    hold-expiry-delay: 3600000
    payment-reconcile-delay: 3600000
    refund-reconcile-delay: 3600000
    orphan-sweep:
      # "-" 는 스케줄 비활성이다. 테스트에서 돌면 실제 S3 를 부른다 — 목록 조회와 삭제라 더 위험하다
      cron: "-"
  auth:
    cookie-secure: false
  crypto:
    seller-key: bW9ldW0tbG9jYWwtZGV2LWtleS1ETy1OT1QtVVNFISE=
  storage:
    bucket: moeum-test-bucket
    public-base-url: https://img.test.moeum.store
  oauth:
    kakao:
      client-id: test-client-id
      client-secret: test-secret
      redirect-uri: http://localhost/auth/kakao/callback

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.testcontainers: warn
    com.github.dockerjava: warn
